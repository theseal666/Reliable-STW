<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="330" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">STW/leeway accuracy through a race day</text>
  <text x="330" y="40" text-anchor="middle" font-size="11" fill="#6b7280">sharp on tacks, decaying through a static leg</text>

  <!-- zone backgrounds -->
  <rect x="60" y="52" width="101.25" height="228" fill="#3b4fa0" opacity="0.08"/>
  <rect x="161.25" y="52" width="405" height="228" fill="#9ca3af" opacity="0.12"/>
  <rect x="566.25" y="52" width="33.75" height="228" fill="#3b4fa0" opacity="0.08"/>

  <text x="118" y="66" text-anchor="middle" font-size="12" fill="#3b4fa0" font-weight="600">racing, constant tacks</text>
  <text x="363" y="66" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="600">12h offshore reach — no tacks</text>
  <text x="583" y="66" text-anchor="middle" font-size="11" fill="#3b4fa0" font-weight="600">arrival</text>

  <!-- axes -->
  <line x1="60" y1="280" x2="600" y2="280" stroke="#111827" stroke-width="1.5"/>
  <line x1="60" y1="52" x2="60" y2="280" stroke="#111827" stroke-width="1.5"/>
  <text x="330" y="316" text-anchor="middle" font-size="13" fill="#374151">time (hours)</text>
  <text x="24" y="166" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90 24 166)">STW/leeway accuracy (± kn)</text>

  <!-- y gridlines/labels -->
  <text x="50" y="284" text-anchor="end" font-size="11" fill="#6b7280">0</text>
  <text x="50" y="224" text-anchor="end" font-size="11" fill="#6b7280">0.3</text>
  <text x="50" y="164" text-anchor="end" font-size="11" fill="#6b7280">0.6</text>
  <text x="50" y="104" text-anchor="end" font-size="11" fill="#6b7280">0.9</text>
  <text x="50" y="56" text-anchor="end" font-size="11" fill="#6b7280">1.2</text>

  <!-- x labels -->
  <text x="60" y="296" text-anchor="middle" font-size="11" fill="#6b7280">0</text>
  <text x="161" y="296" text-anchor="middle" font-size="11" fill="#6b7280">3h</text>
  <text x="330" y="296" text-anchor="middle" font-size="11" fill="#6b7280">9h</text>
  <text x="566" y="296" text-anchor="middle" font-size="11" fill="#6b7280">15h</text>
  <text x="600" y="296" text-anchor="middle" font-size="11" fill="#6b7280">16h</text>

  <!-- accuracy curve -->
  <polyline fill="none" stroke="#c1440e" stroke-width="3"
    points="60,232 66.75,264 80.25,268 93.75,270 107.25,268 120.75,270 134.25,268 147.75,270 161.25,268 195,240 262.5,202 330,170 397.5,140 465,114 532.5,90 566.25,80 576.375,258 600,264" />

  <!-- tick marks for tacks -->
  <g fill="#3b4fa0">
    <circle cx="66.75" cy="264" r="3.5"/>
    <circle cx="80.25" cy="268" r="3.5"/>
    <circle cx="93.75" cy="270" r="3.5"/>
    <circle cx="107.25" cy="268" r="3.5"/>
    <circle cx="120.75" cy="270" r="3.5"/>
    <circle cx="134.25" cy="268" r="3.5"/>
    <circle cx="147.75" cy="270" r="3.5"/>
    <circle cx="161.25" cy="268" r="3.5"/>
    <circle cx="576.375" cy="258" r="3.5"/>
  </g>

  <!-- annotation, placed in clear white space well above the curve/dots -->
  <text x="110" y="94" font-size="10" fill="#3b4fa0" text-anchor="middle">tacks reset</text>
  <text x="110" y="106" font-size="10" fill="#3b4fa0" text-anchor="middle">accuracy</text>
  <line x1="110" y1="112" x2="110" y2="250" stroke="#3b4fa0" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>

  <rect x="10" y="326" width="640" height="30" fill="#f3f4f6"/>
  <text x="20" y="338" font-size="11" fill="#374151">Each dot is a tack/gybe: fresh heading-change information sharpens the estimate.</text>
  <text x="20" y="351" font-size="11" fill="#374151">No maneuvers &#8594; uncertainty grows through the leg, then resets on the next tack.</text>
</svg>
