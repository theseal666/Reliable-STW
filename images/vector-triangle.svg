<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4fa0"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c1440e"/>
    </marker>
  </defs>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">SOG = W (true water velocity) + C (current)</text>

  <!-- heading reference -->
  <line x1="140" y1="400" x2="140" y2="75" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="148" y="88" font-size="12" fill="#6b7280">heading (bow direction)</text>

  <circle cx="140" cy="400" r="4" fill="#111827"/>
  <text x="95" y="405" font-size="12" fill="#111827">boat</text>

  <path d="M 140 360 A 40 40 0 0 1 149 361" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <text x="95" y="345" font-size="11" fill="#6b7280">leeway</text>

  <!-- vectors -->
  <line x1="140" y1="400" x2="190" y2="150" stroke="#3b4fa0" stroke-width="3" marker-end="url(#arrowW)"/>
  <line x1="190" y1="150" x2="300" y2="165" stroke="#0e7c86" stroke-width="3" marker-end="url(#arrowC)"/>
  <line x1="140" y1="400" x2="300" y2="165" stroke="#c1440e" stroke-width="4" marker-end="url(#arrowS)"/>

  <!-- small labelled markers, offset clear of the lines and each other -->
  <circle cx="147" cy="275" r="11" fill="#ffffff" stroke="#3b4fa0" stroke-width="2"/>
  <text x="147" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="#3b4fa0">W</text>

  <circle cx="245" cy="138" r="11" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
  <text x="245" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7c86">C</text>

  <circle cx="238" cy="300" r="11" fill="#ffffff" stroke="#c1440e" stroke-width="2"/>
  <text x="238" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#c1440e">S</text>

  <!-- legend, well clear of the diagram -->
  <rect x="430" y="105" width="310" height="290" rx="8" fill="#fafafa" stroke="#e5e7eb"/>

  <circle cx="452" cy="140" r="9" fill="#ffffff" stroke="#3b4fa0" stroke-width="2"/>
  <text x="452" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#3b4fa0">W</text>
  <text x="472" y="136" font-size="13" font-weight="600" fill="#3b4fa0">W — true water velocity</text>
  <text x="472" y="154" font-size="11" fill="#6b7280">magnitude = k_cal · STW_raw</text>
  <text x="472" y="170" font-size="11" fill="#6b7280">direction = heading − leeway</text>

  <circle cx="452" cy="220" r="9" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
  <text x="452" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7c86">C</text>
  <text x="472" y="216" font-size="13" font-weight="600" fill="#0e7c86">C — current (set &amp; drift)</text>
  <text x="472" y="234" font-size="11" fill="#6b7280">assumed ~constant over</text>
  <text x="472" y="250" font-size="11" fill="#6b7280">one maneuver</text>

  <circle cx="452" cy="300" r="9" fill="#ffffff" stroke="#c1440e" stroke-width="2"/>
  <text x="452" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#c1440e">S</text>
  <text x="472" y="296" font-size="13" font-weight="600" fill="#c1440e">SOG — measured directly</text>
  <text x="472" y="314" font-size="11" fill="#6b7280">RTK GNSS velocity vector</text>

  <text x="452" y="360" font-size="11" fill="#111827" font-weight="600">Only SOG is measured.</text>
  <text x="452" y="378" font-size="11" fill="#111827">W and C are the two unknowns</text>

  <rect x="10" y="415" width="740" height="34" fill="#f3f4f6"/>
  <text x="20" y="436" font-size="12" fill="#374151">Only SOG is measured directly. W and C are the two unknown vectors that sum to it — resolve one, and the other falls out.</text>
</svg>
