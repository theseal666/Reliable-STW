<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4fa0"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c1440e"/>
    </marker>
  </defs>

  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">SOG = W (true water velocity) + C (current)</text>

  <line x1="160" y1="380" x2="160" y2="60" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="168" y="72" font-size="13" fill="#6b7280">heading (bow direction)</text>

  <circle cx="160" cy="380" r="4" fill="#111827"/>
  <text x="124" y="400" font-size="13" fill="#111827">boat</text>

  <path d="M 160 340 A 40 40 0 0 1 168 341" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <text x="176" y="352" font-size="12" fill="#6b7280">leeway</text>

  <line x1="160" y1="380" x2="212" y2="128" stroke="#3b4fa0" stroke-width="3" marker-end="url(#arrowW)"/>
  <text x="216" y="150" font-size="14" fill="#3b4fa0" font-weight="600">W — true water velocity</text>
  <text x="216" y="168" font-size="12" fill="#3b4fa0">|W| = k_cal · STW_raw, dir = heading − leeway</text>

  <line x1="212" y1="128" x2="302" y2="136" stroke="#0e7c86" stroke-width="3" marker-end="url(#arrowC)"/>
  <text x="230" y="116" font-size="14" fill="#0e7c86" font-weight="600">C — current (set &amp; drift)</text>

  <line x1="160" y1="380" x2="302" y2="136" stroke="#c1440e" stroke-width="4" marker-end="url(#arrowS)"/>
  <text x="308" y="150" font-size="14" fill="#c1440e" font-weight="600">SOG — measured directly</text>
  <text x="308" y="168" font-size="12" fill="#c1440e">(RTK GNSS velocity)</text>

  <rect x="10" y="404" width="620" height="28" fill="#f3f4f6"/>
  <text x="20" y="422" font-size="13" fill="#374151">Only SOG is measured directly. W and C are the two unknown vectors that sum to it — resolve one, and the other falls out.</text>
</svg>
